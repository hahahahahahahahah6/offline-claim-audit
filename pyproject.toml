[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-claim-audit"
version = "0.1.0"
description = "Static audit of documentation claims about network requirements"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Hao Li"}]
dependencies = []

[project.scripts]
offline-claim-audit = "offline_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
